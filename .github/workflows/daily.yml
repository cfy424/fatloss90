name: daily-generate

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 17:00 = 北京时间次日 01:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's data
        run: node generate_today.mjs

      - name: Commit and push
        run: |
          git config user.name "cfy424"
          git config user.email "602409791@qq.com"
          git add today.json
          git diff --cached --quiet || git commit -m "chore: 生成 $(TZ=Asia/Shanghai date +%F) 当日数据"
          git push
